<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Array Manipulation</title>
</head>
<body>
	<h1>Array Manipulation</h1>

	<label for="elementInput">Element:</label>
	<input type="number" id="elementInput" step="1">
	<button type="button" onclick="addElement()">Add (push)</button>
	<button type="button" onclick="removeElement()">Remove Last (pop)</button>
	<button type="button" onclick="sortElements()">Sort</button>
	<button type="button" onclick="mapElements()">Double (map)</button>

	<br><br>

	<label for="filterInput">Keep values greater than:</label>
	<input type="number" id="filterInput" step="1">
	<button type="button" onclick="filterElements()">Filter</button>

	<p>Current array: <span id="arrayOutput">[]</span></p>
	<div id="message"></div>

	<script>
		let numbers = [];

		function displayArray(message = "") {
			document.getElementById("arrayOutput").textContent = `[${numbers.join(", ")}]`;
			document.getElementById("message").textContent = message;
		}

		function addElement() {
			const input = document.getElementById("elementInput");
			const value = Number(input.value);

			if (input.value === "" || !Number.isFinite(value)) {
				displayArray("Enter a valid number to add.");
				return;
			}

			numbers.push(value);
			input.value = "";
			displayArray(`${value} was added.`);
		}

		function removeElement() {
			if (numbers.length === 0) {
				displayArray("The array is empty.");
				return;
			}

			const removedValue = numbers.pop();
			displayArray(`${removedValue} was removed.`);
		}

		function sortElements() {
			numbers.sort((first, second) => first - second);
			displayArray("The array was sorted.");
		}

		function mapElements() {
			numbers = numbers.map((number) => number * 2);
			displayArray("Each element was doubled using map().");
		}

		function filterElements() {
			const input = document.getElementById("filterInput");
			const minimum = Number(input.value);

			if (input.value === "" || !Number.isFinite(minimum)) {
				displayArray("Enter a valid minimum value to filter.");
				return;
			}

			numbers = numbers.filter((number) => number > minimum);
			displayArray(`Values greater than ${minimum} remain.`);
		}
	</script>
</body>
</html>
