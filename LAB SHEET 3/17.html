<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Exercise 17 — Vowel Counter</title>
	<style>
		body { max-width: 700px; margin: 3rem auto; padding: 0 1rem; font-family: Arial, sans-serif; }
		textarea { box-sizing: border-box; width: 100%; min-height: 8rem; padding: 0.7rem; }
		button { margin-top: 0.7rem; padding: 0.6rem 0.9rem; cursor: pointer; }
	</style>
</head>
<body>
	<main>
		<h1>17. Count Vowels in a Paragraph</h1>
		<label for="paragraph">Enter a paragraph:</label>
		<textarea id="paragraph">JavaScript can add interaction and useful features to a webpage.</textarea>
		<button type="button" id="countButton">Count vowels</button>
		<p id="result" aria-live="polite"></p>
	</main>
	<script>
		function countVowels(text) {
			return (text.match(/[aeiou]/gi) || []).length;
		}

		document.getElementById("countButton").addEventListener("click", function () {
			const text = document.getElementById("paragraph").value;
			document.getElementById("result").textContent = `Vowel count: ${countVowels(text)}`;
		});
	</script>
</body>
</html>
