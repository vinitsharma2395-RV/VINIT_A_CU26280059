<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Exercise 21 — Callback and setTimeout</title>
	<style>
		body { max-width: 650px; margin: 3rem auto; padding: 0 1rem; font-family: Arial, sans-serif; }
		button { padding: 0.6rem 0.9rem; cursor: pointer; }
		#result { margin-top: 1rem; }
	</style>
</head>
<body>
	<main>
		<h1>21. Callback and Asynchronous Behavior</h1>
		<p>Click the button. The callback runs after a short delay using <code>setTimeout</code>.</p>
		<button type="button" id="runButton">Run asynchronous example</button>
		<p id="result" role="status" aria-live="polite"></p>
	</main>
	<script>
		function finishLater(callback) {
			setTimeout(function () {
				callback("The callback ran after 1.5 seconds.");
			}, 1500);
		}

		document.getElementById("runButton").addEventListener("click", function () {
			const result = document.getElementById("result");
			result.textContent = "Started… waiting for the callback.";

			finishLater(function (message) {
				result.textContent = message;
			});
		});
	</script>
</body>
</html>
