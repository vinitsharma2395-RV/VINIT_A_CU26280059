<!DOCTYPE html>
<html>
<head>
    <title>Financial Report</title>
</head>
<body>
    <h1>Quarterly Financial Report</h1>
    <table border="1">
        <caption>Company Income and Expenses</caption>
        <thead>
            <tr>
                <th>Month</th>
                <th>Income</th>
                <th>Expenses</th>
                <th>Net Result</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td>$12,000</td>
                <td>$7,500</td>
                <td>$4,500</td>
            </tr>
            <tr>
                <td>February</td>
                <td>$14,000</td>
                <td>$8,000</td>
                <td>$6,000</td>
            </tr>
            <tr>
                <td>March</td>
                <td>$15,500</td>
                <td>$8,500</td>
                <td>$7,000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th>$41,500</th>
                <th>$24,000</th>
                <th>$17,500</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
