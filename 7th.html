    <title>How to Make Tea</title>
</head>
<body>
    <h1>How to Make a Cup of Tea</h1>
    <ol>
        <li>Boil one cup of water.</li>
        <li>Place a tea bag in a cup.</li>
        <li>Pour the hot water into the cup.</li>
        <li>Steep the tea for three to five minutes.</li>
        <li>Add sugar or milk if desired.</li>
        <li>Stir well and enjoy your tea.</li>
    </ol>
</body>
