<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us</title>
	<link rel="stylesheet" href="11.css">
	<style>
		#contact-card .form-title {
			color: #0f766e;
		}

		#contact-card .submit-button {
			background: #0f766e;
		}

		#contact-card .submit-button:hover {
			background: #115e59;
		}
	</style>
</head>
<body>
	<main class="contact-card" id="contact-card">
		<p class="eyebrow">Get in touch</p>
		<h1 class="form-title" style="color: #be123c;">We would love to hear from you</h1>
		<p class="intro">Have a question or suggestion? Complete the form and our team will get back to you soon.</p>

		<form class="contact-form" action="#" method="post">
			<div class="form-grid">
				<div class="field">
					<label for="name">Full name</label>
					<input type="text" id="name" name="name" placeholder="Alex Student" required>
				</div>

				<div class="field">
					<label for="email">Email address</label>
					<input type="email" id="email" name="email" placeholder="you@example.com" required>
				</div>

				<div class="field full-width">
					<label for="subject">Subject</label>
					<select id="subject" name="subject" required>
						<option value="" selected disabled>Choose a subject</option>
						<option value="admissions">Admissions</option>
						<option value="courses">Courses</option>
						<option value="support">Technical support</option>
						<option value="other">Other question</option>
					</select>
				</div>

				<div class="field full-width">
					<label for="message">Message</label>
					<textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
				</div>
			</div>

			<button class="submit-button" type="submit">Send message</button>
		</form>
	</main>
</body>
</html>
