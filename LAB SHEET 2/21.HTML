<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Accessible Account Form</title>
	<style>
		:root {
			--ink: #172033;
			--muted: #64748b;
			--line: #d8e1ea;
			--accent: #0f766e;
			--accent-dark: #115e59;
			--surface: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 24px;
			background: linear-gradient(135deg, #ecfdf5, #f8fafc 55%, #ccfbf1);
			color: var(--ink);
			font-family: "Segoe UI", Tahoma, sans-serif;
		}

		.account-card {
			width: min(100%, 650px);
			padding: clamp(26px, 5vw, 44px);
			border: 1px solid #a7f3d0;
			border-radius: 18px;
			background: var(--surface);
			box-shadow: 0 22px 55px rgba(15, 118, 110, 0.14);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--accent);
			font-size: 0.76rem;
			font-weight: 800;
			letter-spacing: 0.13em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #134e4a;
			font-size: clamp(1.8rem, 4vw, 2.5rem);
		}

		.intro {
			margin: 12px 0 28px;
			color: var(--muted);
			line-height: 1.6;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 18px;
		}

		.form-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 18px;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 7px;
		}

		.full-width {
			grid-column: 1 / -1;
		}

		label,
		legend {
			font-size: 0.9rem;
			font-weight: 700;
		}

		input,
		select,
		textarea,
		button {
			font: inherit;
		}

		input,
		select,
		textarea {
			width: 100%;
			padding: 12px 13px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #f8fafc;
			color: var(--ink);
		}

		input:focus,
		select:focus,
		textarea:focus {
			outline: 3px solid rgba(15, 118, 110, 0.15);
			border-color: var(--accent);
			background: #fff;
		}

		fieldset {
			margin: 0;
			padding: 17px 18px 15px;
			border: 1px solid #d1fae5;
			border-radius: 10px;
			background: #f0fdf4;
		}

		legend {
			padding: 0 8px;
			color: var(--accent);
		}

		.option-list {
			display: flex;
			flex-wrap: wrap;
			gap: 10px 18px;
			margin-top: 4px;
		}

		.option {
			display: flex;
			align-items: center;
			gap: 7px;
			color: var(--muted);
			cursor: pointer;
			font-weight: 600;
		}

		.option input {
			width: auto;
			accent-color: var(--accent);
		}

		textarea {
			min-height: 110px;
			resize: vertical;
		}

		.required-note {
			margin: -3px 0 0;
			color: var(--muted);
			font-size: 0.84rem;
		}

		button {
			align-self: flex-start;
			padding: 13px 23px;
			border: 0;
			border-radius: 9px;
			background: var(--accent);
			box-shadow: 0 9px 16px rgba(15, 118, 110, 0.2);
			color: #fff;
			cursor: pointer;
			font-weight: 800;
		}

		button:hover {
			background: var(--accent-dark);
		}

		@media (max-width: 560px) {
			body {
				padding: 14px;
			}

			.form-grid {
				grid-template-columns: 1fr;
			}

			.full-width {
				grid-column: auto;
			}

			button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main class="account-card">
		<p class="eyebrow">Accessible registration</p>
		<h1>Create your account</h1>
		<p class="intro">Complete the form below. Each control has a directly associated label to support keyboard and assistive technology users.</p>

		<form action="#" method="post">
			<div class="form-grid">
				<div class="field full-width">
					<label for="full-name">Full name</label>
					<input type="text" id="full-name" name="full_name" autocomplete="name" placeholder="Alex Student" required>
				</div>

				<div class="field">
					<label for="email">Email address</label>
					<input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
				</div>

				<div class="field">
					<label for="phone">Phone number</label>
					<input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="9876543210">
				</div>

				<div class="field">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
				</div>

				<div class="field">
					<label for="birth-date">Date of birth</label>
					<input type="date" id="birth-date" name="birth_date" autocomplete="bday">
				</div>

				<div class="field full-width">
					<label for="course">Preferred course</label>
					<select id="course" name="course" required>
						<option value="" selected disabled>Choose a course</option>
						<option value="web-design">Web Design</option>
						<option value="programming">Programming</option>
						<option value="digital-media">Digital Media</option>
					</select>
				</div>
			</div>

			<fieldset>
				<legend>Preferred contact method</legend>
				<div class="option-list">
					<label class="option" for="contact-email">
						<input type="radio" id="contact-email" name="contact_method" value="email" required>
						Email
					</label>
					<label class="option" for="contact-phone">
						<input type="radio" id="contact-phone" name="contact_method" value="phone">
						Phone
					</label>
				</div>
			</fieldset>

			<label class="option" for="terms">
				<input type="checkbox" id="terms" name="terms" required>
				I agree to the terms and privacy policy.
			</label>

			<p class="required-note">Required fields are marked by the browser when submitted.</p>
			<button type="submit">Create account</button>
		</form>
	</main>
</body>
</html>
