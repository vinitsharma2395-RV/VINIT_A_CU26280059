<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Customize Your Preferences</title>
	<style>
		:root {
			--ink: #172033;
			--muted: #64748b;
			--line: #cbd5e1;
			--accent: #7c3aed;
			--accent-dark: #6d28d9;
			--accent-soft: #f5f3ff;
			--surface: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 24px;
			background: linear-gradient(135deg, #f5f3ff, #f8fafc 55%, #ede9fe);
			color: var(--ink);
			font-family: "Segoe UI", Tahoma, sans-serif;
		}

		.preferences-card {
			width: min(100%, 590px);
			padding: clamp(26px, 5vw, 42px);
			border: 1px solid #e2e8f0;
			border-radius: 18px;
			background: var(--surface);
			box-shadow: 0 22px 55px rgba(91, 33, 182, 0.14);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--accent);
			font-size: 0.76rem;
			font-weight: 800;
			letter-spacing: 0.13em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #4c1d95;
			font-size: clamp(1.8rem, 4vw, 2.5rem);
		}

		.intro {
			margin: 12px 0 28px;
			color: var(--muted);
			line-height: 1.6;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 22px;
		}

		fieldset {
			margin: 0;
			padding: 20px;
			border: 1px solid #ddd6fe;
			border-radius: 12px;
			background: #fcfbff;
		}

		legend {
			padding: 0 8px;
			color: #5b21b6;
			font-weight: 800;
		}

		.choice-list {
			display: grid;
			gap: 12px;
		}

		.choice {
			position: relative;
			display: flex;
			align-items: center;
			gap: 11px;
			min-height: 28px;
			color: #475569;
			cursor: pointer;
			font-weight: 600;
		}

		.choice input {
			position: absolute;
			width: 1px;
			height: 1px;
			opacity: 0;
		}

		.control-mark {
			position: relative;
			flex: 0 0 21px;
			width: 21px;
			height: 21px;
			border: 2px solid var(--line);
			background: #fff;
			transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
		}

		.checkbox-mark {
			border-radius: 5px;
		}

		.radio-mark {
			border-radius: 50%;
		}

		.checkbox-mark::before {
			position: absolute;
			top: 2px;
			left: 6px;
			width: 5px;
			height: 10px;
			border: solid #fff;
			border-width: 0 2px 2px 0;
			content: "";
			opacity: 0;
			transform: rotate(45deg) scale(0.7);
			transition: opacity 0.2s ease, transform 0.2s ease;
		}

		.radio-mark::after {
			position: absolute;
			inset: 4px;
			border-radius: 50%;
			background: #fff;
			content: "";
			opacity: 0;
			transform: scale(0.5);
			transition: opacity 0.2s ease, transform 0.2s ease;
		}

		.choice input:checked ~ .checkbox-mark {
			border-color: var(--accent);
			background: var(--accent);
		}

		.choice input:checked ~ .checkbox-mark::before {
			opacity: 1;
			transform: rotate(45deg) scale(1);
		}

		.choice input:checked ~ .radio-mark {
			border-color: var(--accent);
			background: var(--accent);
		}

		.choice input:checked ~ .radio-mark::after {
			opacity: 1;
			transform: scale(1);
		}

		.choice:hover .control-mark {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
		}

		.choice input:focus-visible ~ .control-mark {
			outline: 3px solid rgba(124, 58, 237, 0.22);
			outline-offset: 2px;
		}

		.choice input:checked ~ .control-mark + span {
			color: var(--accent-dark);
		}

		button {
			align-self: flex-start;
			padding: 13px 23px;
			border: 0;
			border-radius: 9px;
			background: var(--accent);
			box-shadow: 0 9px 16px rgba(124, 58, 237, 0.22);
			color: #fff;
			cursor: pointer;
			font: inherit;
			font-weight: 800;
		}

		button:hover {
			background: var(--accent-dark);
		}

		@media (max-width: 480px) {
			body {
				padding: 14px;
			}

			fieldset {
				padding: 18px 14px;
			}

			button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main class="preferences-card">
		<p class="eyebrow">Personal settings</p>
		<h1>Customize your experience</h1>
		<p class="intro">Choose how you would like to receive updates and which topics you want to follow.</p>

		<form action="#" method="post">
			<fieldset>
				<legend>Notification preferences</legend>
				<div class="choice-list">
					<label class="choice">
						<input type="checkbox" name="notifications" value="email">
						<span class="control-mark checkbox-mark" aria-hidden="true"></span>
						<span>Email updates</span>
					</label>
					<label class="choice">
						<input type="checkbox" name="notifications" value="sms">
						<span class="control-mark checkbox-mark" aria-hidden="true"></span>
						<span>SMS reminders</span>
					</label>
					<label class="choice">
						<input type="checkbox" name="notifications" value="weekly">
						<span class="control-mark checkbox-mark" aria-hidden="true"></span>
						<span>Weekly digest</span>
					</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Preferred learning format</legend>
				<div class="choice-list">
					<label class="choice">
						<input type="radio" name="format" value="video" required>
						<span class="control-mark radio-mark" aria-hidden="true"></span>
						<span>Video lessons</span>
					</label>
					<label class="choice">
						<input type="radio" name="format" value="reading">
						<span class="control-mark radio-mark" aria-hidden="true"></span>
						<span>Reading materials</span>
					</label>
					<label class="choice">
						<input type="radio" name="format" value="practice">
						<span class="control-mark radio-mark" aria-hidden="true"></span>
						<span>Interactive practice</span>
					</label>
				</div>
			</fieldset>

			<button type="submit">Save preferences</button>
		</form>
	</main>
</body>
</html>
