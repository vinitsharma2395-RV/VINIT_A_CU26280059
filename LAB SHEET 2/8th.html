<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Upload Assignment</title>
	<style>
		:root {
			--ink: #172033;
			--muted: #64748b;
			--line: #d6dee8;
			--accent: #ea580c;
			--accent-dark: #c2410c;
			--surface: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 24px;
			background: linear-gradient(135deg, #fff7ed, #f8fafc 55%, #ffedd5);
			color: var(--ink);
			font-family: "Segoe UI", Tahoma, sans-serif;
		}

		.upload-card {
			width: min(100%, 560px);
			padding: clamp(26px, 5vw, 44px);
			border: 1px solid #e2e8f0;
			border-radius: 18px;
			background: var(--surface);
			box-shadow: 0 22px 55px rgba(154, 52, 18, 0.13);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--accent);
			font-size: 0.76rem;
			font-weight: 800;
			letter-spacing: 0.13em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #431407;
			font-size: clamp(1.8rem, 4vw, 2.5rem);
		}

		.intro {
			margin: 12px 0 28px;
			color: var(--muted);
			line-height: 1.6;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 19px;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		label {
			font-size: 0.9rem;
			font-weight: 700;
		}

		input,
		textarea,
		button {
			font: inherit;
		}

		input[type="text"],
		textarea {
			width: 100%;
			padding: 12px 13px;
			border: 1px solid var(--line);
			border-radius: 9px;
			background: #f8fafc;
			color: var(--ink);
		}

		input[type="text"]:focus,
		textarea:focus,
		input[type="file"]:focus-visible {
			outline: 3px solid rgba(234, 88, 12, 0.16);
			outline-offset: 2px;
			border-color: var(--accent);
		}

		textarea {
			min-height: 110px;
			resize: vertical;
		}

		.file-drop {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 8px;
			padding: 28px 18px;
			border: 1.5px dashed #f97316;
			border-radius: 12px;
			background: #fff7ed;
			color: var(--muted);
			text-align: center;
			cursor: pointer;
			transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
		}

		.file-drop:hover {
			border-color: var(--accent-dark);
			background: #ffedd5;
			transform: translateY(-1px);
		}

		.file-icon {
			color: var(--accent);
			font-size: 1.8rem;
		}

		.file-drop strong {
			color: var(--ink);
		}

		.file-drop small {
			font-size: 0.8rem;
		}

		input[type="file"] {
			width: 100%;
			color: var(--muted);
			cursor: pointer;
		}

		input[type="file"]::file-selector-button {
			margin-right: 10px;
			padding: 8px 12px;
			border: 0;
			border-radius: 7px;
			background: #fed7aa;
			color: #9a3412;
			cursor: pointer;
			font: inherit;
			font-weight: 700;
		}

		.submit-button {
			align-self: flex-start;
			padding: 13px 22px;
			border: 0;
			border-radius: 9px;
			background: var(--accent);
			box-shadow: 0 9px 16px rgba(234, 88, 12, 0.22);
			color: #fff;
			cursor: pointer;
			font-weight: 800;
			transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
		}

		.submit-button:hover {
			background: var(--accent-dark);
			box-shadow: 0 12px 20px rgba(194, 65, 12, 0.28);
			transform: translateY(-2px);
		}

		.submit-button:active {
			box-shadow: 0 4px 8px rgba(194, 65, 12, 0.2);
			transform: translateY(1px) scale(0.98);
		}

		.submit-button:focus-visible {
			outline: 3px solid rgba(234, 88, 12, 0.3);
			outline-offset: 3px;
		}

		@media (max-width: 520px) {
			body {
				padding: 14px;
			}

			.submit-button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main class="upload-card">
		<p class="eyebrow">Coursework portal</p>
		<h1>Upload your assignment</h1>
		<p class="intro">Add a short note and attach your finished work. Accepted formats include PDF, DOCX, and ZIP.</p>

		<form action="#" method="post" enctype="multipart/form-data">
			<div class="field">
				<label for="title">Assignment title</label>
				<input type="text" id="title" name="title" placeholder="e.g. Web design portfolio" required>
			</div>

			<div class="field">
				<label for="file">Choose a file</label>
				<div class="file-drop">
					<span class="file-icon" aria-hidden="true">&#128196;</span>
					<strong>Drop your work here</strong>
					<small>or choose a file from your device, up to 10 MB</small>
					<input type="file" id="file" name="file" accept=".pdf,.doc,.docx,.zip" required>
				</div>
			</div>

			<div class="field">
				<label for="notes">Additional notes <span>(optional)</span></label>
				<textarea id="notes" name="notes" placeholder="Add anything your instructor should know..."></textarea>
			</div>

			<button class="submit-button" type="submit">Submit assignment</button>
		</form>
	</main>
</body>
</html>
