<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign in | Student Portal</title>
	<style>
		:root {
			--ink: #1f2937;
			--muted: #64748b;
			--line: #d8e0e8;
			--accent: #2563eb;
			--accent-dark: #1d4ed8;
			--paper: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 24px;
			background: linear-gradient(135deg, #eff6ff, #f8fafc 52%, #e0f2fe);
			color: var(--ink);
			font-family: "Segoe UI", Tahoma, sans-serif;
		}

		.login-card {
			position: relative;
			isolation: isolate;
			width: min(100%, 430px);
			overflow: hidden;
			padding: 42px 38px 36px;
			border: 1px solid rgba(255, 255, 255, 0.8);
			border-radius: 20px;
			background: var(--paper);
			box-shadow: 0 24px 60px rgba(30, 64, 175, 0.16);
		}

		.card-accent {
			position: absolute;
			z-index: -1;
			top: -54px;
			right: -44px;
			width: 150px;
			height: 150px;
			border-radius: 50%;
			background: #dbeafe;
		}

		.brand-badge {
			position: absolute;
			top: 22px;
			right: 24px;
			padding: 6px 10px;
			border-radius: 999px;
			background: #eff6ff;
			color: var(--accent);
			font-size: 0.72rem;
			font-weight: 800;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--accent);
			font-size: 0.76rem;
			font-weight: 800;
			letter-spacing: 0.13em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #172554;
			font-size: 2rem;
			line-height: 1.1;
		}

		.intro {
			margin: 12px 0 28px;
			color: var(--muted);
			line-height: 1.55;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 18px;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 7px;
		}

		label {
			font-size: 0.9rem;
			font-weight: 700;
		}

		input,
		button {
			width: 100%;
			font: inherit;
		}

		input {
			padding: 13px 14px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: #f8fafc;
			color: var(--ink);
		}

		input:focus {
			outline: 3px solid rgba(37, 99, 235, 0.16);
			border-color: var(--accent);
			background: #fff;
		}

		.form-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-top: -2px;
			font-size: 0.85rem;
		}

		.remember {
			display: flex;
			align-items: center;
			gap: 8px;
			color: var(--muted);
		}

		.remember input {
			width: auto;
			accent-color: var(--accent);
		}

		a {
			color: var(--accent);
			font-weight: 700;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		button {
			margin-top: 4px;
			padding: 13px 16px;
			border: 0;
			border-radius: 10px;
			background: var(--accent);
			box-shadow: 0 10px 18px rgba(37, 99, 235, 0.22);
			color: #fff;
			cursor: pointer;
			font-weight: 800;
		}

		button:hover {
			background: var(--accent-dark);
		}

		.signup {
			margin: 24px 0 0;
			color: var(--muted);
			font-size: 0.9rem;
			text-align: center;
		}

		@media (max-width: 460px) {
			body {
				padding: 16px;
			}

			.login-card {
				padding: 36px 22px 28px;
			}

			.brand-badge {
				right: 18px;
			}
		}
	</style>
</head>
<body>
	<main class="login-card">
		<span class="card-accent" aria-hidden="true"></span>
		<span class="brand-badge">Secure access</span>

		<p class="eyebrow">Student portal</p>
		<h1>Welcome back</h1>
		<p class="intro">Sign in to continue to your courses, results, and campus updates.</p>

		<form action="#" method="post">
			<div class="field">
				<label for="email">Email address</label>
				<input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
			</div>

			<div class="form-row">
				<label class="remember" for="remember">
					<input type="checkbox" id="remember" name="remember">
					Remember me
				</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>

			<button type="submit">Sign in</button>
		</form>

		<p class="signup">New here? <a href="#create-account">Create an account</a></p>
	</main>
</body>
</html>
