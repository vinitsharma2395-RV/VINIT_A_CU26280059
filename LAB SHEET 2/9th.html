<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Campus Experience Survey</title>
	<style>
		:root {
			--ink: #172033;
			--muted: #64748b;
			--line: #d7e0ea;
			--accent: #be123c;
			--accent-soft: #fff1f2;
			--surface: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			padding: 24px;
			background: linear-gradient(135deg, #fff1f2, #f8fafc 55%, #ffe4e6);
			color: var(--ink);
			font-family: "Segoe UI", Tahoma, sans-serif;
		}

		.survey-card {
			width: min(100%, 680px);
			padding: clamp(26px, 5vw, 44px);
			border: 1px solid #e2e8f0;
			border-radius: 18px;
			background: var(--surface);
			box-shadow: 0 22px 55px rgba(159, 18, 57, 0.13);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--accent);
			font-size: 0.76rem;
			font-weight: 800;
			letter-spacing: 0.13em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #881337;
			font-size: clamp(1.8rem, 4vw, 2.5rem);
		}

		.intro {
			margin: 12px 0 28px;
			color: var(--muted);
			line-height: 1.6;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 20px;
		}

		fieldset {
			min-width: 0;
			margin: 0;
			padding: 22px 20px 18px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: #fcfdff;
		}

		legend {
			padding: 0 10px;
			color: var(--accent);
			font-size: 0.95rem;
			font-weight: 800;
		}

		.field-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 7px;
		}

		.full-width {
			grid-column: 1 / -1;
		}

		label {
			font-size: 0.9rem;
			font-weight: 700;
		}

		input,
		select,
		textarea,
		button {
			font: inherit;
		}

		input[type="text"],
		input[type="email"],
		select,
		textarea {
			width: 100%;
			padding: 11px 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--surface);
			color: var(--ink);
		}

		input:focus,
		select:focus,
		textarea:focus {
			outline: 3px solid rgba(190, 18, 60, 0.14);
			border-color: var(--accent);
		}

		.choice-list {
			display: flex;
			flex-wrap: wrap;
			gap: 10px 18px;
			margin-top: 2px;
		}

		.choice {
			display: flex;
			align-items: center;
			gap: 7px;
			color: var(--muted);
			cursor: pointer;
			font-weight: 600;
		}

		.choice input {
			accent-color: var(--accent);
		}

		textarea {
			min-height: 105px;
			resize: vertical;
		}

		button {
			align-self: flex-start;
			padding: 13px 24px;
			border: 0;
			border-radius: 9px;
			background: var(--accent);
			box-shadow: 0 9px 16px rgba(190, 18, 60, 0.2);
			color: #fff;
			cursor: pointer;
			font-weight: 800;
		}

		button:hover {
			background: #9f1239;
		}

		@media (max-width: 560px) {
			body {
				padding: 14px;
			}

			.field-grid {
				grid-template-columns: 1fr;
			}

			.full-width {
				grid-column: auto;
			}

			button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main class="survey-card">
		<p class="eyebrow">Campus voice</p>
		<h1>Tell us about your experience</h1>
		<p class="intro">Your answers help us improve student life, learning support, and campus services.</p>

		<form action="#" method="post">
			<fieldset>
				<legend>About you</legend>
				<div class="field-grid">
					<div class="field">
						<label for="name">Full name</label>
						<input type="text" id="name" name="name" placeholder="Alex Student" required>
					</div>
					<div class="field">
						<label for="email">Email address</label>
						<input type="email" id="email" name="email" placeholder="you@example.com" required>
					</div>
					<div class="field full-width">
						<label for="year">Year of study</label>
						<select id="year" name="year" required>
							<option value="" selected disabled>Choose your year</option>
							<option value="first">First year</option>
							<option value="second">Second year</option>
							<option value="third">Third year</option>
							<option value="final">Final year</option>
						</select>
					</div>
				</div>
			</fieldset>

			<fieldset>
				<legend>Overall satisfaction</legend>
				<div class="choice-list">
					<label class="choice"><input type="radio" name="satisfaction" value="excellent" required> Excellent</label>
					<label class="choice"><input type="radio" name="satisfaction" value="good"> Good</label>
					<label class="choice"><input type="radio" name="satisfaction" value="average"> Average</label>
					<label class="choice"><input type="radio" name="satisfaction" value="poor"> Poor</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>What should we improve?</legend>
				<div class="choice-list">
					<label class="choice"><input type="checkbox" name="improvements" value="courses"> Courses</label>
					<label class="choice"><input type="checkbox" name="improvements" value="facilities"> Facilities</label>
					<label class="choice"><input type="checkbox" name="improvements" value="support"> Student support</label>
					<label class="choice"><input type="checkbox" name="improvements" value="events"> Campus events</label>
				</div>
			</fieldset>

			<fieldset>
				<legend>Additional comments</legend>
				<div class="field">
					<label for="comments">Your thoughts</label>
					<textarea id="comments" name="comments" placeholder="Share any details or suggestions..."></textarea>
				</div>
			</fieldset>

			<button type="submit">Submit survey</button>
		</form>
	</main>
</body>
</html>
